name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecimycampus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ecimycampus_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ecimycampus_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npx prisma migrate deploy
      - run: npm run test:coverage
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - name: Validate compose file
        run: docker compose config --quiet
      - name: Build migration and production images
        run: |
          docker build --target builder -t eci-mycampus-backend:migrate .
          docker build -t eci-mycampus-backend:ci .
      - name: Smoke test production image
        run: |
          docker run -d --name backend --network host \
            -e DATABASE_URL="$DATABASE_URL" -e PORT=4000 \
            -e JWT_SECRET=ci_only_value_never_used_outside_this_job \
            eci-mycampus-backend:ci
          curl --fail --silent --retry 15 --retry-delay 2 --retry-all-errors http://localhost:4000/health/ready
          docker logs backend
